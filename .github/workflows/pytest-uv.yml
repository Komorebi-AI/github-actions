name: pytest

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
      uv-version:
        required: false
        type: string
        default: latest
      debug-enabled:
        required: false
        type: boolean
        default: false
    secrets:
        codecov-token: 
          required: false
        ssh-private-key:
          required: false

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        if: ${{ inputs.debug-enabled }}
        with:
          detached: true
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        env: 
            ssh-private-key: ${{ secrets.ssh-private-key }}
        if: ${{ env.ssh-private-key != '' }}
        with:
          ssh-private-key: ${{ secrets.ssh-private-key }}
      # We support a specific Python version as arg or reading it from
      # the .python-version file
      - name: Install uv and Python
        if: ${{ inputs.python-version != '' }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ inputs.python-version }}
      - name: Install uv and Python using .python-version
        if: ${{ inputs.python-version == '' }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Alternative, sometimes faster due to Github caching the Python version
      # - name: "Set up Python"
      #   uses: actions/setup-python@v6
      #   with:
      #     python-version-file: ".python-version" OR python-version: ${{ inputs.python-version }}
      - name: Install the project
        run: |
          uv sync --locked --dev --all-extras
      - name: Test with pytest
        run: |
          uv run pytest
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env: 
            codecov-token: ${{ secrets.codecov-token }}
        if: ${{ env.codecov-token != '' }}
        with:
          token: ${{ secrets.codecov-token }}
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
