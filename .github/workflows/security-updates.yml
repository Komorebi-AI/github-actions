name: Security Updates

on:
  workflow_call:
    inputs:
      runs-on:
        required: false
        type: string
        # Short job: a third the price on the 1-core slim runner.
        default: ubuntu-slim
      uv-version:
        required: false
        type: string
        default: latest
      branch-name:
        required: false
        type: string
        default: security/dependency-updates
      pr-title:
        required: false
        type: string
        default: "Security: upgrade vulnerable dependencies"
      debug-enabled:
        required: false
        type: boolean
        default: false
    secrets:
      token:
        required: true
      ssh-private-key:
        required: false

jobs:
  fix-transitive-vulns:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.token }}
          persist-credentials: true # zizmor: ignore[artipacked] update.py pushes with these credentials
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        if: ${{ inputs.debug-enabled }}
        with:
          detached: true
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        env:
          ssh-private-key: ${{ secrets.ssh-private-key }}
        if: ${{ env.ssh-private-key != '' }}
        with:
          ssh-private-key: ${{ secrets.ssh-private-key }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ inputs.uv-version }}
      # Same script as the security-updates composite action, at the
      # revision of this workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .komorebi-github-actions
          persist-credentials: false
      - name: Run security updates
        run: python .komorebi-github-actions/security-updates/update.py
        env:
          GH_TOKEN: ${{ secrets.token }}
          INPUT_BRANCH_NAME: ${{ inputs.branch-name }}
          INPUT_PR_TITLE: ${{ inputs.pr-title }}
