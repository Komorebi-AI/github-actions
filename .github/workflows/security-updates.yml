name: Security Updates

on:
  workflow_call:
    inputs:
      runs-on:
        required: false
        type: string
        # Short job: a third the price on the 1-core slim runner.
        default: ubuntu-slim
      uv-version:
        required: false
        type: string
        default: latest
      branch-name:
        required: false
        type: string
        default: security/dependency-updates
      pr-title:
        required: false
        type: string
        default: "Security: upgrade vulnerable dependencies"
      debug-enabled:
        required: false
        type: boolean
        default: false
    secrets:
      token:
        required: true
      ssh-private-key:
        required: false

jobs:
  fix-transitive-vulns:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.token }}
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ inputs.debug-enabled }}
        with:
          detached: true
      - uses: webfactory/ssh-agent@v0.10.0
        env:
          ssh-private-key: ${{ secrets.ssh-private-key }}
        if: ${{ env.ssh-private-key != '' }}
        with:
          ssh-private-key: ${{ secrets.ssh-private-key }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ inputs.uv-version }}
      # Same script as the security-updates composite action, at the
      # revision of this workflow.
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .komorebi-github-actions
      - name: Run security updates
        run: python .komorebi-github-actions/security-updates/update.py
        env:
          GH_TOKEN: ${{ secrets.token }}
          INPUT_BRANCH_NAME: ${{ inputs.branch-name }}
          INPUT_PR_TITLE: ${{ inputs.pr-title }}
