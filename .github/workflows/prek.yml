name: prek

on:
  workflow_call:
    inputs:
      runs-on:
        required: false
        type: string
        # 1-core slim runner: a third the price of ubuntu-latest, and our
        # lint jobs measured only ~1.3x slower on it. Pass ubuntu-latest for
        # jobs that are CPU-bound or run over the slim 15-minute job ceiling.
        default: ubuntu-slim
      python-version:
        required: false
        type: string
        default: ''
      uv-version:
        required: false
        type: string
        default: latest
      prek-args:
        required: false
        type: string
        default: '--all-files'
      debug-enabled:
        required: false
        type: boolean
        default: false
    secrets:
      ssh-private-key:
        required: false

jobs:
  prek:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # required to grab the history of the PR for prek
          fetch-depth: 0
          persist-credentials: false
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        if: ${{ inputs.debug-enabled }}
        with:
          detached: true
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        env:
          ssh-private-key: ${{ secrets.ssh-private-key }}
        if: ${{ env.ssh-private-key != '' }}
        with:
          ssh-private-key: ${{ secrets.ssh-private-key }}
      # We support a specific Python version as arg or reading it from
      # the .python-version file. If there is not a .python-version file
      # it will pick the first Python version allowed by looking at the
      # `requires-python` field of the `pyproject.toml` file.
      - name: Install uv and Python
        if: ${{ inputs.python-version != '' }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ inputs.python-version }}
      - name: Install uv and Python using .python-version
        if: ${{ inputs.python-version == '' }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the project
        run: uv sync --locked --dev --all-extras
      - name: Run prek
        uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6
        env:
          # Enables zizmor's online audits.
          GH_TOKEN: ${{ github.token }}
        with:
          extra-args: ${{ inputs.prek-args }}
