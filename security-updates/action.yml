name: Security Updates
description: >
  Upgrade vulnerable dependencies (direct and transitive) in uv.lock
  by reading Dependabot alerts and running uv lock --upgrade-package
  for each affected package. Opens or updates a single PR with details.
  Authenticates via a GitHub App.

inputs:
  app-id:
    description: GitHub App ID
    required: true
  private-key:
    description: GitHub App private key (PEM)
    required: true
  branch-name:
    description: Branch name for the PR
    required: false
    default: security/dependency-updates
  pr-title:
    description: Title for the PR
    required: false
    default: "security: upgrade vulnerable dependencies"
  uv-version:
    description: uv version to install
    required: false
    default: latest

runs:
  using: composite
  steps:
    - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      id: app-token
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: write
        permission-pull-requests: write
        permission-vulnerability-alerts: read
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: ${{ inputs.uv-version }}
    - name: Configure git with app token
      shell: bash
      run: |
        git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git"
        # Drop the GITHUB_TOKEN header persisted by actions/checkout; git prefers it
        # over the token in the URL, which attributes pushes to github-actions[bot].
        git config http.https://github.com/.extraheader ""
      env:
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
    - name: Run security updates
      shell: bash
      run: python "${{ github.action_path }}/update.py"
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        INPUT_BRANCH_NAME: ${{ inputs.branch-name }}
        INPUT_PR_TITLE: ${{ inputs.pr-title }}
